name: Bazos Music Scraper

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Stiahnutie repozitára
        uses: actions/checkout@v4

      - name: Nastavenie Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Inštalácia knižníc a prehliadača Playwright
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Spustenie scrapera
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bazos_hunter.py

      - name: Uloženie nových úlovkov a videných inzerátov do repozitára
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_ads.txt vyhodne_inzeraty.csv || true
          git diff --staged --quiet || git commit -m "Aktualizácia inzerátov [skip ci]"
          git push
